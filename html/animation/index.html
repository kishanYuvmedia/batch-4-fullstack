<html>
    <head>
        <style>
            .box{
                height: 200px;
                width: 200px;
                background-color: red;
                animation-name: animationframe;
                animation-duration: 10s;
                animation-timing-function:ease-out;
                animation-iteration-count: infinite;
                /* transform: rotate(120deg); */
                /* transform: scale(3); */
                /* transform: scaleX(2); */
                /* transform: scaleY(3); */
                /* transform: rotateZ(150deg); */
                /* transform: skewY(80deg); */
                /* transform:matrix(1, -0.3, 0, 1, 200, 100); */
                /* transition: margin-left 10s; */
            }
            /* .box:active{
                 margin-left:900px;
                 transform: rotate(180deg);
                 border-radius: 50%;
                 background-color: blue;
            } */
            @keyframes animationframe{
                from{
                    background-color: red;
                    border-radius: 0%;
                }
                to{
                     background-color: rgb(101, 5, 185);
                    border-radius: 50%;
                }
            }
            .boxnew{
                width: 300px;
                height: 300px;
                background-color: red;
                animation-name:animationround;
                animation-duration: 30s;
                animation-iteration-count: infinite;
            }
            @keyframes animationround{
                0%{
                    background-color: red;
                }
                10%{
                    background-color: rgb(116, 18, 18);
                }
                20%{
                    background-color: rgb(0, 255, 200);
                }
                30%{
                   background-image: url("../istockphoto-517188688-612x612.jpg");
                }
                40%{
                    background-color: rgb(133, 123, 41);
                }
                60%{
                    background-color: rgb(100, 5, 35);
                }
                 70%{
                    background-color: rgb(4, 2, 2);
                }
                 80%{
                    background-color: rgb(16, 126, 165);
                }
                 90%{
                    background-color: rgb(25, 140, 121);
                }
                 100%{
                    background-color: rgb(13, 255, 0);
                }
            }
        </style>
    </head>
    <body>
        <!-- <div class="box">

        </div> -->

        <div class="boxnew">

        </div>
    </body>
</html>
