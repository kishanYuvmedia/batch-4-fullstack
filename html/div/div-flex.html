<html>
    <head>
        <style>
            .row{
                width: 100%;
                 height: 1000px;
                background-color: rgb(170, 183, 195);
                display: flex;
                flex-wrap:wrap;
                justify-content: center;
               
            }
            .col-4{
                height: 400px;
                width: 20%;
                background-color: red;
                margin-left: 5px;
                margin-bottom: 5px;
                align-self: center;
            }

            /* #grid */
            .row-grid{
                width: 100%;
                height: 400px;
                background-color: antiquewhite;
                display: grid;
                grid-template-columns: 25% 25% 25% 25%;
                gap: 40px;
            }
            .col-grid-4{
                height: 200px;
                background-color: red;
            }
        </style>
    </head>
