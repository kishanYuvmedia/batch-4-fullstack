<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function showName(){
            const name=document.getElementsByName('name')[0].value
            document.getElementById("printName").innerText=name
            console.log(name)
        }
        function showCity(){
            const city=document.getElementsByName('city')[0].value
            document.getElementById("printCity").innerText=city
            console.log(city)
        }
        function changeStyle(){
            document.getElementById('city').style.backgroundColor="red"
        }
    </script>
</head>
<body>
   <input type="text" name="name" onchange="showName()" id="name">
   <input type="text" name="city" onkeyup="showCity()" id="city">
   <!-- <button type="button" onclick="showName()">Show Name</button> -->
   <h1 id="printName"></h1>
    <h1 id="printCity"></h1>
</body>
</html>
